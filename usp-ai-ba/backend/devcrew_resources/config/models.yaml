# Model configuration for DevCrew roles.
#
# One chat model is shared by all roles by default so Ollama never has to swap
# weights on a 16-24GB GPU. Override per role only if you have the VRAM for it.
# Every role inherits `defaults`; keys under `roles.<role>` override them.

embeddings:
  model: nomic-embed-text

defaults:
  model: qwen2.5:14b
  num_ctx: 16384
  temperature: 0.1
  # Tokens reserved for the model's answer; context builders keep prompts
  # within num_ctx - num_predict.
  num_predict: 4096
  # Structured outputs: "schema" (Ollama JSON-schema constrained decoding), "json", or "none".
  structured_format: schema

roles:
  planner:
    temperature: 0.3
  architect:
    temperature: 0.3
  developer:
    temperature: 0.1
  reviewer:
    temperature: 0.1
  qa:
    temperature: 0.1
  # The Coordinator is not a persona; it only handles exceptions. Its own prompt context
  # (_task_context) is small next to a Developer/Reviewer's, so trading some prompt budget for
  # a bigger answer cap is cheap here -- a "replan" decision's reason + guidance +
  # revised_task.description is the largest-footprint reply the Coordinator can produce, and
  # could plausibly hit the 4096-token default mid-JSON. generate_structured now detects that
  # case for certain (Ollama's own done_reason=="length") instead of guessing from a truncated
  # log line; this headroom bump reduces how often it needs to.
  coordinator:
    temperature: 0.1
    num_predict: 6144
