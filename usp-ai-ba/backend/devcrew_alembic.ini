[alembic]
# Renamed from "alembic" -> "devcrew_alembic" during the merge into
# StoryForge's backend, to keep DevCrew's migration scripts namespaced
# alongside its other devcrew_*-prefixed top-level additions.
script_location = %(here)s/devcrew_alembic
prepend_sys_path = .
# The URL comes from DEVCREW_DATABASE_URL (see devcrew_alembic/env.py); nothing is hardcoded here.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
