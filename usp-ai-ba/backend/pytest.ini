[pytest]
; DevCrew's ported test suite (tests/devcrew/) uses native `async def test_...`
; functions, relying on pytest-asyncio's auto mode (matches its original
; pyproject.toml's `asyncio_mode = "auto"`). StoryForge's own tests call
; asyncio.run() manually inside plain sync test functions, so this setting
; has no effect on them -- both styles coexist safely.
asyncio_mode = auto
