[pytest]
; DevCrew's ported test suite (tests/devcrew/) uses native `async def test_...`
; functions, relying on pytest-asyncio's auto mode (matches its original
; pyproject.toml's `asyncio_mode = "auto"`). StoryForge's own tests call
; asyncio.run() manually inside plain sync test functions, so this setting
; has no effect on them -- both styles coexist safely.
asyncio_mode = auto
; Restrict bare `pytest`/`pytest -q` to tests/ only. Without this,
; devcrew_resources/templates/python/tests/ (DevCrew's own project-scaffold
; template -- a real pytest project it stamps out for brand-new Python
; repos, complete with its own conftest.py) gets swept up too and collides
; with tests/conftest.py under the same "tests.conftest" module name,
; failing collection entirely. An explicit path (e.g. `pytest
; tests/test_ask_router.py -q`) still works unchanged -- testpaths only
; applies when no path is given on the command line.
testpaths = tests
