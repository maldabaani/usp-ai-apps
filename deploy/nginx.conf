# Login-throttle zone (used by the /api/auth/login location below). Internal/VPN-only
# deployment, so this is cheap insurance against a compromised internal host brute-forcing
# the admin account, not a substitute for real rate limiting at scale.
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer-when-downgrade;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    root /usr/share/nginx/html;
    index index.html;

    # Ask Technical/Business SSE endpoints (api/routers/ask.py) — buffering
    # must stay off so the stream is forwarded chunk by chunk instead of
    # being held until it ends. Placed ahead of the general /api/ block below
    # since nginx matches the most specific (longest) prefix/regex location
    # first.
    location ~ ^/api/ask/(technical|business)$ {
        proxy_pass http://storyforge-backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Throttled separately from the general /api/ block below (most specific
    # location wins) so a compromised internal host can't brute-force login.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://storyforge-backend:8000/api/auth/login;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # StoryForge AI backend. Buffering is off and the read timeout is
    # extended here too (not just on the Ask SSE routes above) since
    # DevCrew's own run-progress/log SSE endpoints live under this general
    # prefix and need the same chunk-by-chunk forwarding.
    location /api/ {
        proxy_pass http://storyforge-backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_connect_timeout 300s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular SPA (catch-all, must be last)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
