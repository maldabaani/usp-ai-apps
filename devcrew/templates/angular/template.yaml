id: angular-standalone
stack: angular
description: Angular 19 standalone app (signals, OnPush, router) with Karma/Jasmine specs.
install_cmd: npm install --no-audit --no-fund
build_cmd: npx ng build
test_cmd: npx ng test --watch=false --browsers=ChromeHeadless
coverage_cmd: npx ng test --watch=false --browsers=ChromeHeadless --code-coverage
# Live preview (started on request from the run page, on an internal network)
preview_cmd: npx ng serve --host 0.0.0.0 --port 4200
preview_port: 4200
