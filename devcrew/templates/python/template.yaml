id: python-fastapi
stack: python
description: FastAPI 0.115+ app (routers/schemas/services layout, pydantic-settings) with pytest and ruff.
install_cmd: pip install -q -e ".[dev]"
build_cmd: python -m compileall -q app
test_cmd: pytest -q
coverage_cmd: pytest -q --cov=app --cov-report=term
# Live preview (started on request from the run page, on an internal network)
preview_cmd: uvicorn app.main:app --host 0.0.0.0 --port 8000
preview_port: 8000
