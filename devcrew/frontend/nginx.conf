server {
    listen 4200;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: unknown paths serve index.html (Angular router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed bundles can be cached forever; index.html never.
    location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /config.json {
        add_header Cache-Control "no-cache";
    }
}
