# Java / Spring Boot 3 benchmark tasks. The hidden acceptance tests
# (benchmarks/hidden_tests/<id>/) are @SpringBootTest + MockMvc classes in the package
# com.devcrew.app.hidden, so the application class must stay com.devcrew.app.Application.
stack: java
tasks:
  - id: java-todo-crud
    difficulty: 1
    title: TODO CRUD REST API
    request: |
      Build a Spring Boot TODO REST API with CRUD and JUnit 5 tests.

      Contract (keep com.devcrew.app.Application and GET /api/health; store data in memory,
      no database; JSON bodies):
      - POST /api/todos {"title": string, "done": boolean (optional, default false)} -> 201
        {"id": number, "title": string, "done": boolean}. The title must be 1-200 characters
        and not blank, otherwise 400.
      - GET /api/todos -> 200 with the list of all todos.
      - GET /api/todos/{id} -> 200 or 404.
      - PUT /api/todos/{id} {"title", "done"} replaces the todo -> 200 with it, 404 if it does
        not exist, 400 on an invalid title.
      - DELETE /api/todos/{id} -> 204 with an empty body, or 404.
      - Ids are unique positive numbers and are never reused.

  - id: java-contacts-validation
    difficulty: 2
    title: Contacts API with validation and search
    request: |
      Build a Spring Boot contacts REST API with Bean Validation, a consistent error format,
      search, and JUnit 5 tests.

      Contract (keep com.devcrew.app.Application and GET /api/health; store data in memory,
      no database):
      - POST /api/contacts {"name": string (not blank, max 100), "email": string (valid email),
        "phone": string (optional; if present 7-20 characters of digits, spaces, "+" or "-")}
        -> 201 {"id": number, "name", "email", "phone"} (phone is null when not given).
      - Validation failures -> 400 with the body {"errors": {"<field>": "<message>", ...}}
        containing one entry per invalid field.
      - Emails are unique case-insensitively: creating or updating a contact with an email used
        by ANOTHER contact -> 409.
      - GET /api/contacts -> 200 with all contacts sorted by name (case-insensitive);
        optional ?q= filters to contacts whose name or email contains q (case-insensitive).
      - GET /api/contacts/{id} -> 200 or 404.
      - PUT /api/contacts/{id} with the same body as POST replaces the contact -> 200, 404 if
        missing, 400/409 as above.
      - DELETE /api/contacts/{id} -> 204, or 404.

  - id: java-library-loans
    difficulty: 3
    title: Library with authors, books and loans
    request: |
      Build a Spring Boot library-management REST API (authors, books, loans) with JUnit 5
      tests, using controller/service/repository layers per resource.

      Contract (keep com.devcrew.app.Application and GET /api/health; store data in memory,
      no database; invalid request bodies -> 400):
      - POST /api/authors {"name": string (1-100 chars, not blank)} -> 201 {"id", "name"};
        GET /api/authors/{id} -> 200 or 404.
      - POST /api/books {"title": string (1-200, not blank), "authorId": number, "copies":
        number >= 1} -> 201 {"id", "title", "authorId", "copies", "available"} where available
        is the number of copies not currently on loan. Unknown authorId -> 404.
      - GET /api/books/{id} -> 200 (with the current "available") or 404.
      - GET /api/authors/{id}/books -> 200 with the author's books, 404 for an unknown author.
      - POST /api/loans {"bookId": number, "borrower": string (1-100, not blank)} -> 201
        {"id", "bookId", "borrower", "returned": false}. Unknown book -> 404; no copy
        available -> 409.
      - POST /api/loans/{id}/return -> 200 with the loan and "returned": true; unknown loan
        -> 404; already returned -> 409.
      - GET /api/loans?active=true lists only loans not yet returned (no parameter: all).

  - id: java-shop-orders
    difficulty: 4
    title: Shop with products, inventory and orders
    request: |
      Build a multi-module Spring Boot shop backend (products, inventory, orders) with JUnit 5
      tests. Keep business rules in services, use DTOs for requests/responses, and map domain
      errors to HTTP status codes in a @RestControllerAdvice.

      Contract (keep com.devcrew.app.Application and GET /api/health; store data in memory,
      no database; invalid request bodies -> 400):
      - POST /api/products {"sku": string (1-40), "name": string (1-200), "price": number > 0,
        "stock": integer >= 0} -> 201 with the same fields. Duplicate sku -> 409.
      - GET /api/products -> 200 list; ?inStock=true returns only products with stock > 0.
      - GET /api/products/{sku} -> 200 or 404.
      - PATCH /api/products/{sku}/stock {"delta": integer} adjusts the stock and returns the
        product; a result below zero -> 409 and nothing changes; unknown sku -> 404.
      - POST /api/orders {"items": [{"sku": string, "quantity": integer >= 1}, ...]} (at least
        one item) -> 201 {"id": number, "status": "PLACED", "items": [{"sku", "quantity",
        "unitPrice", "lineTotal"}], "total": number}. lineTotal = unitPrice * quantity, total
        = sum of line totals (2 decimals). Placing an order decrements stock. Unknown sku ->
        404; not enough stock for any line -> 409; in both cases NO stock changes
        (all-or-nothing).
      - GET /api/orders/{id} -> 200 or 404.
      - POST /api/orders/{id}/cancel -> 200 with "status": "CANCELLED" and the stock of every
        line restored; already cancelled -> 409; unknown order -> 404.
